name: Release Code Integrity Github Actions

on: [push]

jobs:
  tag_code_integrity_github_action:
    runs-on: ubuntu-latest
    name: Tag Code Integrity Actions
    steps:
      - name: Get Jscrambler Version
        id: get_version
        uses: johngeorgewright/parse-version-action@72f62834450c8b6f8cbc766455b892c2a6bc4794
        with:
          ref: "refs/tags/jscrambler@8.22.1"
          trim-start: jscrambler@
      - name: Get Access Token
        id: get_workflow_token
        uses: peter-murray/workflow-application-token-action@dad2b81e50ce3edeb5f3b7ffbd79f731368bd668
        with:
          application_id: ${{ secrets.CODE_INTEGRITY_ACTIONS_APP_ID }}
          application_private_key: ${{ secrets.CODE_INTEGRITY_ACTIONS_PRIVATE_KEY }}
      - name: Checkout Code Integrity Actions Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jscrambler/code-integrity-actions
          token: ${{ steps.get_workflow_token.outputs.token }}
      - name: Update Jscrambler CLI Version
        uses: jossef/action-set-json-field@890d7642122dbb2833dddd2003659bb71a2b21fe
        with:
          file: package.json
          field: dependencies.jscrambler
          value: ${{ steps.get_version.outputs.version }}
      - name: Create pull request to bump Code Integrity Action to ${{ steps.get_version.outputs.version }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.get_workflow_token.outputs.token }}
          commit-message: "Bump Jscrambler dependency to ${{ steps.get_version.outputs.version }}"
          branch: release/jscrambler-${{ steps.get_version.outputs.version }}
          title: "Bump Jscrambler dependency to ${{ steps.get_version.outputs.version }}"
          body: "Updates the Jscrambler dependency to ${{ steps.get_version.outputs.version }}."
          add-paths: package.json
          sign-commits: true
      - name: Notify failure
        if: ${{ failure() }}
        env:
          WEBHOOK_URI: ${{ secrets.WEBHOOK_API_URI }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg text "Release code-integrity-actions failed: $RUN_URL" '{text: $text}' |
            curl --fail --silent --show-error \
              --header 'Content-Type: application/json' \
              --data-binary @- "$WEBHOOK_URI"
