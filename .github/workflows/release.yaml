name: Release

on:
  push:
    branches:
      - release/staged

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Get Access Token
        id: get_workflow_token
        uses: peter-murray/workflow-application-token-action@v5
        with:
          application_id: ${{ secrets.CODE_INTEGRITY_ACTIONS_APP_ID }}
          application_private_key: ${{ secrets.CODE_INTEGRITY_ACTIONS_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          token: ${{ steps.get_workflow_token.outputs.token }}

      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true
          run_install: true

      - name: Create Release Pull Request or Publish to Staged npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm ci:publish
          commit-message: "chore(changeset): bump versions"
          pr-title: "[Changeset] Bump Versions"
          create-github-releases: false
          push-git-tags: false
          github-token: ${{ steps.get_workflow_token.outputs.token }}
