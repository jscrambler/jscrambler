name: Release

on:
  push:
    branches:
      - release/staged

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Get Access Token
        id: get_workflow_token
        uses: peter-murray/workflow-application-token-action@dad2b81e50ce3edeb5f3b7ffbd79f731368bd668
        with:
          application_id: ${{ secrets.CODE_INTEGRITY_ACTIONS_APP_ID }}
          application_private_key: ${{ secrets.CODE_INTEGRITY_ACTIONS_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ steps.get_workflow_token.outputs.token }}

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          version: 11
          runtime: node@24
          cache: true
          install: true

      - name: Create Release Pull Request or Publish to Staged npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          publish: pnpm ci:publish
          commit: "chore(changeset): bump versions"
          title: "[Changeset] Bump Versions"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ steps.get_workflow_token.outputs.token }}
